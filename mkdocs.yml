site_name: PDHCG
site_description: GPU-Accelerated Solver for Quadratic Conic Programming
site_author: Hongpei Li
site_url: https://lhongpei.github.io/PDHCG/
exclude_docs: |
  README.md
  overrides/

repo_name: Lhongpei/PDHCG
repo_url: https://github.com/Lhongpei/PDHCG

nav:
  - Home: index.md
  - Documentation:
    - Overview: documentation/index.md
    - Getting started:
      - Installation: installation.md
      - Python quick start: python/quickstart.md
      - Examples: examples.md
    - Python API:
      - Model class: python/model.md
      - Parameters: python/parameters.md
    - C API:
      - Overview: c/overview.md
      - Types: c/types.md
      - Functions: c/functions.md
      - Combined reference: C_API.md
    - Migration:
      - Migrating to 0.3: migration.md
  - Algorithm: algorithm.md
  - Citation: citation.md

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/cg-mark.svg
  favicon: assets/cg-mark.svg
  icon:
    repo: fontawesome/brands/github
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            show_source: true
            show_root_heading: true
            show_category_heading: true
            show_docstring_attributes: true
            show_docstring_functions: true
            show_docstring_classes: true
            show_docstring_modules: true
            heading_level: 2
            filters: ["!^_"]
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            show_if_no_docstring: false
            docstring_section_style: table

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2024–2026 Hongpei Li, Haihao Lu · Apache 2.0

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Lhongpei/PDHCG
